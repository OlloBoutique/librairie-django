<!DOCTYPE html>
<html>
<head>
    <title>Détail livre</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5 text-center">

    <h1>{{ livre.titre }}</h1>

    {% if livre.image %}
    <img src="{{ livre.image.url }}" width="200" class="mb-3">
    {% endif %}

    <h3 class="text-success">{{ livre.prix }} FCFA</h3>

    <br>

    <a href="https://wa.me/2250140981288?text=Bonjour je veux acheter le livre {{ livre.titre }}"
       class="btn btn-success">
       Commander sur WhatsApp
    </a>
    <br><br>

    {% if livre.pdf %}
    <a href="https://wa.me/2250140981288?text=Bonjour je veux acheter le livre {{ livre.titre }}" class="btn btn-primary" target="_blank" >
    Télécharger le PDF
    </a>
    {% endif %}

    <br><br>

    <a href="/" class="btn btn-dark">Retour boutique</a>

</div>

</body>
</html>
