<!DOCTYPE html>
<html>
<head>
    <title>Panier</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <h1>Mon Panier 🛒</h1>

 {% for livre in livres %}
<div class="d-flex justify-content-between align-items-center border p-2 mb-2">
    <div>
        {{ livre.titre }} × {{ livre.quantite }} <br>
        Sous-total : {{ livre.sous_total }} FCFA
    </div>

    <a href="{% url 'supprimer_panier' livre.id %}" 
       class="btn btn-danger btn-sm">
        Supprimer
    </a>
</div>
{% endfor %}

<hr>

<h4 class="text-end">
    Total : <span class="text-success">{{ total }} FCFA</span>
</h4>
    <a href="https://wa.me/2250140981288?text={{ message }}"
   class="btn btn-success mt-3"
   onclick="setTimeout(function(){ window.location.href='{% url 'commander' %}'; }, 2000);">
   Commander sur WhatsApp
</a> 
</div>

</body>
</html>
