<!DOCTYPE html>
<html>
<head>
    <title>Ma Librairie</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Style -->
    <style>
        body{
            background: #f4f6f9;
        }
        .card:hover{
            transform: scale(1.03);
            transition: 0.3s;
        }
        .navbar-brand{
            font-weight: bold;
            font-size: 25px;
        }
    </style>
</head>

<body>

<!-- 🔥 NAVBAR -->
<a href="{% url 'panier' %}" class="btn btn-dark">
    🛒 Panier ({{ nombre_panier }})
</a>

<nav class="navbar navbar-dark bg-dark shadow">
    <div class="container">
        <span class="navbar-brand">📚 Librairie Ollo</span>
    </div>
</nav>

<!-- 🔥 HEADER -->
<div class="container mt-4 text-center">
    <h1 class="fw-bold">Bienvenue dans ma librairie</h1>
    <p class="text-muted">Achète tes livres facilement 📖</p>
</div>

<!-- 🔥 LIVRES -->
<div class="container mt-5">
    <div class="row">

        {% for livre in livres %}
        <div class="col-md-3">
            <div class="card shadow mb-4 border-0">

                <div class="card-body text-center">

                    {% if livre.image %}
                    <img src="{{ livre.image.url }}" width="150" class="mb-3">
                    {% endif %}

                    <a href="/livre/{{ livre.id }}/" style="text-decoration:none; color:black;">
                    <h5 class="fw-bold">{{ livre.titre }}</h5>
                    </a>
                    <p class="text-success fw-bold">
                        {{ livre.prix }} FCFA
                    </p>

                    <a href="https://wa.me/2250140981288?text=Bonjour je veux acheter le livre {{ livre.titre }}"
                       class="btn btn-success w-100" target="_blank">
                       Acheter sur WhatsApp
                    </a>
                  <form method="POST" action="{% url 'ajouter_panier' livre.id %}">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-warning w-100 mt-2">
                       Ajouter au panier
                    </button>
                  </form>

                </div>
            </div>
        </div>
        {% endfor %}

    </div>
</div>

<!-- 🔥 FOOTER -->
<footer class="bg-dark text-white text-center p-3 mt-5">
    Librairie Ollo © 2026
</footer>

</body>
</html>
